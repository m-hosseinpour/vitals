{% import "_macros.html" as ui %}
<div
  id="dashboard-content"
  data-updated-ago="{{ updated_at|ago }}"
  data-updated-clock="{{ updated_at|clock }}"
  data-live-failed="{% if live and accounts|selectattr('error')|list %}1{% else %}0{% endif %}"
>
  <div class="accounts">
    {% for account in accounts %}{{ ui.account_card(account, packages_url) }}{% endfor %}
  </div>
  <section class="system" aria-label="وضعیت ماشین">
    {{ ui.disk_card(disk) }}
    {{ ui.pulse_card(pulse) }}
  </section>
</div>
