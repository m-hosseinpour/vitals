{% extends "base.html" %}

{% block title %}ویتالز — وضعیت اعتبار{% endblock %}
{% block body_class %}app-page{% endblock %}

{% block content %}
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.8 12h3.9l2.4-6.2 4.3 12.4 2.4-6.2h5.4"></path>
      </svg>
    </span>
    <span class="brand-text">
      <strong>ویتالز</strong>
      <small>وضعیت اعتبار <bdi>AvalAI</bdi></small>
    </span>
  </div>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="btn btn-ghost" type="submit">خروج</button>
  </form>
</header>

<main class="shell" id="dashboard" data-refresh-url="/partials/body">
  {% include "_body.html" %}
</main>
{% endblock %}

{% block scripts %}
<script src="{{ asset('app.js') }}" defer></script>
{% endblock %}
